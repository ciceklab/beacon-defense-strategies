name: beacon
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
channel_priority: strict
dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - scipy
  - tqdm
  - pytorch=2.1
  - pytorch-cuda=11.8
  - torchmetrics
  - datasets
  - regex
  - pyyaml
  - typing_extensions
  - jupyter
  - ipykernel
  - scikit-learn
  - pip:
      - matplotlib==3.10.5
      - seaborn==0.13.2
      - joblib==1.3.2
      - line-profiler==4.1.3
      - pyarrow==14.0.2
      - pygame==2.5.2
      - swig==4.2.1
      - threadpoolctl==3.3.0
